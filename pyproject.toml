[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-document-agent"
version = "1.0.0"
description = "Reads finance documents and accepts a field only when the code can prove it. A sample by I-Team Collage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "I-Team Collage", email = "contact@iteamcollage.com" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.urls]
Homepage = "https://iteamcollage.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
